# Event pipeline defaults for Stage B post-processing.
# The scripts also keep these values as code defaults so dry-runs work without
# this file. Treat this template as the operator-reviewed place to tune
# thresholds before publication-quality analysis.

event_classes:
  - no_event
  - deformation_only
  - weak_hcp
  - confirmed_DXA

thresholds:
  confirmed_dxa_min_segments: 1
  confirmed_dxa_min_line_length_A: 1.0e-9
  weak_hcp_min_atoms: 5
  weak_hcp_min_pct: 0.01
  weak_other_min_atoms: 10
  deformation_strain_p95_min: 0.01
  deformation_strain_p99_min: 0.02
  deformation_dmin2_p95_min: 0.1
  deformation_dmin2_p99_min: 0.2
  deformation_displacement_p95_min_A: 0.75
  deformation_displacement_max_min_A: 2.0

event_window:
  pre_steps: 10000
  post_steps: 10000
  dump_every: 100
  analysis_every: 100

output_layout:
  root: "<run_root>/event_pipeline"
  event_timeline_csv: "event_timeline.csv"
  event_timeline_json: "event_timeline.json"
  frame_manifests: "*_frame_manifest.{csv,json}"
  figure_manifest: "figure_manifest.{csv,json}"
  video_manifest: "videos/event_animation_30fps.manifest.json"

render_presets:
  geometry:
    camera_id: stageB_geometry_overview_v1
    coloring_mode: particle_type
    visible_layers: atoms,inclusion,gb,legend,scalebar
  deformation:
    camera_id: stageB_deformation_fixed_v1
    coloring_mode: atomic_strain_or_Dmin2
    visible_layers: atoms,inclusion,gb,legend,scalebar,timestep_label
  dxa:
    camera_id: stageB_dxa_fixed_v1
    coloring_mode: dxa_lines
    visible_layers: atoms,dxa,legend,scalebar,timestep_label
  event:
    camera_id: stageB_event_fixed_v1
    coloring_mode: structure_type+dxa
    visible_layers: atoms,inclusion,gb,dxa,legend,scalebar,timestep_label

video:
  fps: 30
  width: 1920
  overwrite_by_default: false
